<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Recursos Humanos</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    
<form action="http://localhost/Parcial2/logica/procesarAspRH.php" method="POST">
  <input type="hidden" name="registro" value="true">

  <label for="cedula">Cedula:</label>
  <input type="text" name="cedula" id="cedula" required>

    <br>

  <label for="nombre">Nombre:</label>
  <input type="text" name="nombre" id="nombre" required>
        
    <br>

    <label for="apellido">Apellido:</label>
  <input type="text" name="apellido" id="apellido" required>
        
    <br>

 <label for="estado_civil">Estado Civil:</label>
<select name="estado_civil" id="estado_civil" required>
  <option value="">-- Selecciona una opción --</option>
  <option value="soltero">Soltero/a</option>
  <option value="casado">Casado/a</option>
  <option value="divorciado">Divorciado/a</option>
  <option value="viudo">Viudo/a</option>
  <option value="union_libre">Unión libre</option>
</select>
        
    <br>

 <label for="Genero">Género:</label>
<select name="genero" id="genero" required>
  <option value="">-- Selecciona una opción --</option>
  <option value="Hombre">Hombre</option>
  <option value="Mujer">Mujer</option>
  <option value="Otro">Otro</option>
</select>

<br>

<label for="tipo_sangre">Tipo de Sangre:</label>
<select name="tipo_sangre" id="tipo_sangre" required>
  <option value="">-- Selecciona tu tipo de sangre --</option>
  <option value="A+">A+</option>
  <option value="A-">A-</option>
  <option value="B+">B+</option>
  <option value="B-">B-</option>
  <option value="AB+">AB+</option>
  <option value="AB-">AB-</option>
  <option value="O+">O+</option>
  <option value="O-">O-</option>
</select>

<br>

<label for="fecha_nacimiento">Fecha de Nacimiento</label>
<input type="date" name="fecha_nacimiento" id="fecha_nacimiento" required>
<br>

<label for="nacionalidad">Nacionalidad:</label>
<select name="nacionalidad" id="nacionalidad" required>
  <option value="">-- Selecciona tu nacionalidad --</option>
  <option value="Panameña">Panameña</option>
  <option value="Costarricense">Costarricense</option>
  <option value="Colombiana">Colombiana</option>
  <option value="Venezolana">Venezolana</option>
  <option value="Mexicana">Mexicana</option>
  <option value="Argentina">Argentina</option>
  <option value="Chilena">Chilena</option>
  <option value="Peruana">Peruana</option>
</select>
<br>

<label for="teléfono">Teléfono:</label>
  <input type="text" name="telefono" id="telefono" required>
<br>

<label for="residencia">Lugar de Residencia:</label>
<input type="text" name="residencia" id="residencia" required>
<br>

<label for="email">Correo Electrónico:</label>
<input type="email" name="email" id="email" required>
<br>


<button type="submit">Aplicar</button>
</form>



</body>
</html>
