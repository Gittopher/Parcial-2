<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulario Recursos Humanos</title>
  <link rel="stylesheet" href="../assets/registroAsp.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
  <header>
    <div class ="formulario__header">
    <h2>Registro de Aspirantes</h2>
    
    </div>
  </header>
<form action="http://localhost/Parcial2/logica/procesarAspRH.php" id="formularioHR" method="POST">
  <input type="hidden" name="registro" value="true" />

  <section class="formulario__contenedor">
    <h2>Por favor, completa el siguiente formulario con la información del aspirante.</h2>

    <div class="formulario__fila">
      <!-- Columna izquierda -->
      <div class="formulario__columna">
        <label for="cedula">Cédula:</label>
        <input type="text" name="cedula" id="cedula" required>

        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre" id="nombre" required>

        <label for="apellido">Apellido:</label>
        <input type="text" name="apellido" id="apellido" required>

        <label for="telefono">Teléfono:</label>
        <input type="text" name="telefono" id="telefono" required>
      </div>

      <!-- Columna derecha -->
      <div class="formulario__columna">
        <label for="estado_civil">Estado Civil:</label>
        <select name="estado_civil" id="estado_civil" required>
          <option value="">-- Selecciona una opción --</option>
          <option value="soltero">Soltero/a</option>
          <option value="casado">Casado/a</option>
          <option value="divorciado">Divorciado/a</option>
          <option value="viudo">Viudo/a</option>
          <option value="union_libre">Unión libre</option>
        </select>

        <label for="genero">Género:</label>
        <select name="genero" id="genero" required>
          <option value="">-- Selecciona una opción --</option>
          <option value="Hombre">Hombre</option>
          <option value="Mujer">Mujer</option>
          <option value="Otro">Otro</option>
        </select>

        <label for="tipo_sangre">Tipo de Sangre:</label>
        <select name="tipo_sangre" id="tipo_sangre" required>
          <option value="">-- Selecciona tu tipo de sangre --</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
        </select>

        <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
        <input type="date" name="fecha_nacimiento" id="fecha_nacimiento" required>

        <label for="nacionalidad">Nacionalidad:</label>
        <select name="nacionalidad" id="nacionalidad" required>
          <option value="">-- Selecciona tu nacionalidad --</option>
          <option value="Panameña">Panameña</option>
          <option value="Costarricense">Costarricense</option>
          <option value="Colombiana">Colombiana</option>
          <option value="Venezolana">Venezolana</option>
          <option value="Mexicana">Mexicana</option>
          <option value="Argentina">Argentina</option>
          <option value="Chilena">Chilena</option>
          <option value="Peruana">Peruana</option>
        </select>
      </div>
    </div>

    <!-- Campos inferiores que ocupan todo el ancho -->
    <div class="formulario__inferior">
      <label for="residencia">Lugar de Residencia:</label>
      <input type="text" name="residencia" id="residencia" required>

      <label for="email">Correo Electrónico:</label>
      <input type="email" name="email" id="email" required>
    </div> 

    <div class="formulario__boton">
      <button type="submit">Aplicar</button>
    </div>
  </section>
</form>
</body>
</html>
