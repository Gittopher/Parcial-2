<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="../assets/estilos.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
</head>
<body>
  <header>
    <div class="formulario__header">
      <h2>¡Bienvenido a nuestro sistema!</h2>
    </div>
  </header>

  <!-- Contenedor principal del contenido centrado -->
  <div class="contenido">
    <form id="formLogin" novalidate class="formulario" action="../logica/procesarLogin.php" method="POST">
      <h2>Bienvenido, inicia sesión</h2>
      <hr>

      <!-- Grupo: Usuario -->
      <div class="formulario__grupo" id="grupo__usuario">
        <label for="usuario" class="formulario__label">Usuario:</label>
        <input type="text" id="usuario" name="usuario" class="formulario__input" required />
        <i class="formulario__validacion-estado fas fa-times-circle"></i>
        <span class="formulario__input-error">Usuario inválido.</span>
      </div>

      <!-- Grupo: Contraseña -->
      <div class="formulario__grupo" id="grupo__password">
        <label for="password" class="formulario__label">Contraseña:</label>
        <input type="password" id="password" name="password" class="formulario__input" minlength="4" maxlength="12" required />
        <i class="formulario__validacion-estado fas fa-times-circle"></i>
        <span class="formulario__input-error">La contraseña debe tener de 4 a 12 caracteres.</span>
      </div>

      <!-- Mensaje de éxito -->
      <div id="mensajeExito" class="formulario__mensaje-exito" style="display: none;">
        <p><i class="fas fa-check-circle"></i> Inicio de sesión exitoso.</p>
      </div>

      <!-- Mensaje de error -->
      <div id="mensajeError" class="formulario__mensaje" style="display: none;">
        <p><i class="fas fa-exclamation-triangle"></i> Error: Llena correctamente los campos.</p>
      </div>

      <button type="submit" class="formulario__btn">Iniciar sesión</button>
      <p class="formulario__texto">¿No tienes una cuenta? <a href="RegisterUser.html">Regístrate aquí</a>.</p>
    </form>
  </div>

  <script src="../assets/validacionLogin.js"></script>
</body>
</html>
