<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información del Aspirante</title>
    <link rel="stylesheet" href="../assets/aspirante.css">
</head>
<body>
    <div class="aspirante-container">
        <!-- Información principal del aspirante -->
        <div class="aspirante-info">
            <h1 id="nombre">Nombre del Aspirante</h1>
            <p><strong>Cédula:</strong> <span id="cedula">0000000000</span></p>
            <p><strong>Edad:</strong> <span id="edad">00</span></p>
            <p><strong>Nacionalidad:</strong> <span id="nacionalidad">País</span></p>
            <p><strong>Teléfono:</strong> <span id="telefono">0000-0000</span></p>
            <p><strong>Correo:</strong> <span id="email">correo@ejemplo.com</span></p>
        </div>

        <!-- Información adicional -->
        <div class="aspirante-extra">
            <h2>Más información</h2>
            <p><strong>Estado Civil:</strong> <span id="estado_civil">Soltero</span></p>
            <p><strong>Género:</strong> <span id="genero">Masculino</span></p>
            <p><strong>Residencia:</strong> <span id="residencia">Ciudad, País</span></p>
            <p><strong>Tipo de sangre:</strong> <span id="tipo_sangre">O+</span></p>
        </div>

        <!-- Botón -->
        <div class="botones">
            <button type="button" id="editarBtn">Editar información</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../assets/editAsp.js"></script>
    <script src="../assets/mostrarAsp.js"></script>
</body>
</html>
