<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información del Aspirante</title>
    <link rel="stylesheet" href="assets/aspirante.css">
</head>
<body>
    <div class="aspirante-container">
        <div class="aspirante-info">
            <h1 id="nombre">Nombre del Aspirante</h1>
            <p><strong>Cédula:</strong> <span id="cedula">123456789</span></p>
            <p><strong>Edad:</strong> <span id="edad">25 años</span></p>
            <p><strong>Nacionalidad:</strong> <span id="nacionalidad">Panameña</span></p>
            <p><strong>Teléfono:</strong> <span id="telefono">+507 6000-0000</span></p>
            <p><strong>Correo:</strong> <span id="email">correo@ejemplo.com</span></p>
        </div>
        <div class="aspirante-extra">
            <h2>Más información</h2>
            <p><strong>Estado Civil:</strong> Soltero/a</p>
            <p><strong>Género:</strong> Hombre</p>
            <p><strong>Residencia:</strong> Ciudad de Panamá</p>
            <p><strong>Tipo de sangre:</strong> O+</p>
        </div>

        <div class="botones">
        <button type="button">Editar información</button>

    </div>
    </div>

</body>
</html>
